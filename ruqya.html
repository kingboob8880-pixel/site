<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --primary: #1e5631;
            --primary-light: #2d7a46;
            --accent: #d4af37;
            --accent-light: #f4d03f;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #5d6d7e;
            --border: #e1e8ed;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .arabic {
            font-family: 'Amiri', serif;
            direction: rtl;
        }

        /* Header (mobile-first: не липнет; sticky только от 769px) */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 1.5rem 1rem;
            position: static;
            top: auto;
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 769px) {
            header {
                position: sticky;
                top: 0;
                z-index: 100;
            }
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        /* Stats Bar */
        .stats-bar {
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-top: 0.75rem;
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }
        .stats-bar span {
            opacity: 0.9;
        }
        .stats-bar strong {
            color: var(--accent-light);
        }

        /* Language Switcher */
        .lang-switcher {
            display: flex;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 0.25rem;
            gap: 0.25rem;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.875rem;
        }

        .lang-btn.active {
            background: white;
            color: var(--primary);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Search and Filter */
        .controls {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.5rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--card-bg);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 86, 49, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Category Pills */
        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            background: var(--card-bg);
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .category-pill:hover,
        .category-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .category-pill .count {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            padding: 0.1rem 0.4rem;
            border-radius: 50px;
            font-size: 0.7rem;
            margin-left: 0.3rem;
        }
        .category-pill.active .count {
            background: rgba(255,255,255,0.3);
        }
        .category-pill:not(.active) .count {
            background: rgba(30,86,49,0.1);
            color: var(--primary);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 1.25rem;
            position: relative;
        }

        .card-number {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(255,255,255,0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .card-type {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-arabic {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-desc {
            color: var(--text-light);
            margin-bottom: 1rem;
            font-size: 0.9375rem;
        }

        /* Solutions */
        .solutions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .solution-item {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .solution-header {
            background: var(--bg);
            padding: 0.875rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: var(--primary);
        }

        .solution-header:hover {
            background: #e8f0e9;
        }

        .solution-header.active {
            background: var(--primary);
            color: white;
        }

        .solution-icon {
            transition: transform 0.3s;
        }

        .solution-header.active .solution-icon {
            transform: rotate(180deg);
        }

        .solution-content {
            display: none;
            padding: 1rem;
            background: white;
        }

        .solution-content.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .arabic-text {
            background: #f0f7f4;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            text-align: center;
            font-size: 1.25rem;
            line-height: 2;
            border-right: 4px solid var(--accent);
        }

        .transcription {
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .translation {
            color: var(--text);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .application {
            background: #fff9e6;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            border-left: 3px solid var(--accent);
        }

        .application strong {
            color: var(--primary);
            display: block;
            margin-bottom: 0.25rem;
        }

        /* Results count */
        .results-info {
            text-align: center;
            color: var(--text-light);
            padding: 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .results-info strong {
            color: var(--primary);
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.25rem;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .card-arabic {
                font-size: 1.25rem;
            }

            .arabic-text {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .card-header {
                padding: 1rem;
            }

            .card-body {
                padding: 1rem;
            }

            .solution-header {
                padding: 0.75rem;
                font-size: 0.875rem;
            }
        }

        /* Print Styles */
        @media print {
            header, .controls, .lang-switcher {
                display: none;
            }
            .card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Back to top */
        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s;
            opacity: 0;
            visibility: hidden;
            z-index: 99;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        /* Methodology callout */
        .methodology-box {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow);
        }
        .methodology-box h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }
        .methodology-box ol {
            margin: 0;
            padding-left: 1.35rem;
            color: var(--text);
            font-size: 0.95rem;
        }
        .methodology-box li {
            margin-bottom: 0.55rem;
            line-height: 1.55;
        }
        .methodology-box li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<div class="container">

    <div class="results-info" id="resultsInfo"></div>

    <div class="grid" id="cardsGrid">

</div>

<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

let currentLang = 'ru';
let currentFilter = 'all';

function updateMethodology() {
    const lang = currentLang;
    const block = data[lang];
    if (!block.methodologyTitle || !block.methodologySteps) return;
    document.getElementById('methodologyTitle').textContent = block.methodologyTitle;
    const ol = document.getElementById('methodologySteps');
    ol.innerHTML = block.methodologySteps.map(step => `<li>${step}</li>`).join('');
}

function switchLang(lang) {
    currentLang = lang;
    
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelectorAll('.lang-btn').forEach(btn => {
        if ((lang === 'ru' && btn.textContent.includes('Рус')) || 
            (lang === 'uz' && btn.textContent.includes("O'z"))) {
            btn.classList.add('active');
        }
    });
    
    document.getElementById('mainTitle').textContent = lang === 'ru' 
        ? 'Руқья - Методы Исцеления' : 'Ruqya - Shifo Usullari';
    document.getElementById('mainSubtitle').textContent = lang === 'ru' 
        ? 'Пророческий метод лечения' : "Payg'ambarona davolash usuli";
    document.getElementById('searchInput').placeholder = lang === 'ru'
        ? 'Поиск видов порчи...' : 'Jodugarlik turlarini qidirish...';

    updateMethodology();
    updateCategoryPills();
    updateStats();
    renderCards();
}

function updateCategoryPills() {
    const lang = currentLang;
    document.querySelectorAll('.category-pill').forEach(pill => {
        const f = pill.dataset.filter;
        const cards = data[lang].cards;
        let count = 0;
        if (f === 'all') count = cards.length;
        else count = cards.filter(c => c.type === f).length;
        
        let label = '';
        if (f === 'all') label = lang === 'ru' ? 'Все' : 'Barchasi';
        else if (f === 'method') label = lang === 'ru' ? 'По способу' : "Usul bo'yicha";
        else if (f === 'goal') label = lang === 'ru' ? 'По цели' : "Maqsad bo'yicha";
        else if (f === 'rare') label = lang === 'ru' ? 'Редкие' : 'Kam uchraydigan';
        
        pill.innerHTML = `${label} <span class="count">${count}</span>`;
    });
}

function updateStats() {
    const cards = data[currentLang].cards;
    document.getElementById('totalCount').textContent = cards.length;
    document.getElementById('methodCount').textContent = cards.filter(c => c.type === 'method').length;
    document.getElementById('goalCount').textContent = cards.filter(c => c.type === 'goal').length;
    document.getElementById('rareCount').textContent = cards.filter(c => c.type === 'rare').length;
}

function renderCards() {
    const grid = document.getElementById('cardsGrid');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    grid.innerHTML = '';
    
    const filteredCards = data[currentLang].cards.filter(card => {
        const matchesFilter = currentFilter === 'all' || card.type === currentFilter;
        const matchesSearch = card.title.toLowerCase().includes(searchTerm) || 
                             card.subtitle.toLowerCase().includes(searchTerm) ||
                             card.desc.toLowerCase().includes(searchTerm);
        return matchesFilter && matchesSearch;
    });
    
    // Results info
    const resultsInfo = document.getElementById('resultsInfo');
    if (searchTerm) {
        resultsInfo.innerHTML = currentLang === 'ru' 
            ? `Найдено: <strong>${filteredCards.length}</strong> из ${data[currentLang].cards.length}`
            : `Topildi: <strong>${filteredCards.length}</strong> / ${data[currentLang].cards.length}`;
    } else {
        resultsInfo.innerHTML = currentLang === 'ru'
            ? `Показано: <strong>${filteredCards.length}</strong> видов`
            : `Ko'rsatilmoqda: <strong>${filteredCards.length}</strong> tur`;
    }
    
    const categoryNames = {
        ru: { method: 'По способу', goal: 'По цели', rare: 'Редкие' },
        uz: { method: 'Usul', goal: 'Maqsad', rare: 'Kam' }
    };
    
    filteredCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card fade-in';
        cardEl.style.animationDelay = `${index * 0.03}s`;
        
        cardEl.innerHTML = `
            <div class="card-header">
                <span class="card-number">#${index + 1}</span>
                <span class="card-type">${categoryNames[currentLang][card.type]}</span>
                <div class="card-title">${card.title}</div>
                <div class="card-arabic arabic">${card.arabic}</div>
                <div style="margin-top: 0.5rem; opacity: 0.9; font-size: 0.9rem;">${card.subtitle}</div>
            </div>
            <div class="card-body">
                <div class="card-desc">${card.desc}</div>
                <div class="solutions">
                    ${card.solutions.map((sol, idx) => `
                        <div class="solution-item">
                            <div class="solution-header" onclick="toggleSolution(this)">
                                <span>${idx + 1}. ${sol.title}</span>
                                <span class="solution-icon">▼</span>
                            </div>
                            <div class="solution-content">
                                <div class="arabic-text arabic">${sol.arabic}</div>
                                <div class="transcription">${sol.transcription}</div>
                                <div class="translation">${sol.translation}</div>
                                ${sol.application ? `
                                    <div class="application">
                                        <strong>${currentLang === 'ru' ? 'Применение:' : "Qo'llanishi:"}</strong>
                                        ${sol.application}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        
        grid.appendChild(cardEl);
    });
}

function toggleSolution(header) {
    const content = header.nextElementSibling;
    const isActive = header.classList.contains('active');
    
    header.parentElement.parentElement.querySelectorAll('.solution-header').forEach(h => {
        h.classList.remove('active');
        h.nextElementSibling.classList.remove('active');
    });
    
    if (!isActive) {
        header.classList.add('active');
        content.classList.add('active');
    }
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', renderCards);

document.querySelectorAll('.category-pill').forEach(pill => {
    pill.addEventListener('click', function() {
        document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderCards();
    });
});

// Back to top button
window.addEventListener('scroll', () => {
    const btn = document.getElementById('backToTop');
    if (window.scrollY > 500) {
        btn.classList.add('visible');
    } else {
        btn.classList.remove('visible');
    }
});

// Initialize
updateMethodology();
updateStats();
updateCategoryPills();
renderCards();
</script>
